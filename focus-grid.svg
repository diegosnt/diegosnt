<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#130c22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <filter id="orb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- Ambient orbs -->
  <circle cx="120" cy="260" r="100" fill="#7C3AED" fill-opacity="0.10" filter="url(#orb-glow)">
    <animate attributeName="cy" values="260;235;260" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1090" cy="40" r="110" fill="#B44FE8" fill-opacity="0.09" filter="url(#orb-glow)">
    <animate attributeName="cy" values="40;65;40" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Card 1: Enfoque Actual -->
  <rect x="20" y="20" width="560" height="120" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#B44FE8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="48" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#C084FC">🎯 Enfoque Actual</text>
  <text x="48" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">Desarrollo de aplicaciones Full Stack y optimización</text>
  <text x="48" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">de flujos de CI/CD</text>

  <!-- Card 2: Intereses -->
  <rect x="620" y="20" width="560" height="120" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1"/>
  <text x="648" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#C084FC">🚀 Intereses</text>
  <text x="648" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">Arquitectura de microservicios, contenedorización</text>
  <text x="648" y="104" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">y desarrollo de interfaces reactivas</text>

  <!-- Card 3: Filosofía -->
  <rect x="20" y="160" width="560" height="120" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1"/>
  <text x="48" y="194" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#C084FC">🧠 Filosofía</text>
  <text x="48" y="224" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">Código limpio, arquitecturas mantenibles y</text>
  <text x="48" y="244" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">automatización donde sea posible</text>

  <!-- Card 4: Aprendiendo -->
  <rect x="620" y="160" width="560" height="120" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#B44FE8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="648" y="194" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="700" fill="#C084FC">🌱 Aprendiendo</text>
  <text x="648" y="224" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">Kubernetes avanzado, patrones de arquitectura</text>
  <text x="648" y="244" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" fill="#94A3B8">distribuida y observabilidad</text>
</svg>
