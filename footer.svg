<svg width="1200" height="160" viewBox="0 0 1200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#130c22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#B44FE8"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <filter id="orb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="160" fill="url(#bg-grad)"/>
  <rect width="1200" height="160" fill="url(#dots)"/>

  <!-- Ambient orbs -->
  <circle cx="180" cy="110" r="75" fill="#7C3AED" fill-opacity="0.10" filter="url(#orb-glow)">
    <animate attributeName="cx" values="180;210;180" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;88;110" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="50" r="85" fill="#B44FE8" fill-opacity="0.09" filter="url(#orb-glow)">
    <animate attributeName="cx" values="1020;990;1020" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;72;50" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="180" r="100" fill="#4C1D95" fill-opacity="0.07" filter="url(#orb-glow)"/>

  <!-- Border line at top -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#border-grad)"/>

  <!-- Center tag -->
  <text x="600" y="88"
    font-family="monospace"
    font-size="15"
    text-anchor="middle"
    fill="#B44FE8"
    fill-opacity="0.35"
    letter-spacing="2">
    &lt; diegosnt /&gt;
    <animate attributeName="fill-opacity" values="0.35;0.55;0.35" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Floating particles -->
  <circle cx="310" cy="44" r="1.5" fill="#B44FE8" fill-opacity="0.5">
    <animate attributeName="cy" values="44;28;44" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="118" r="1" fill="#E879F9" fill-opacity="0.4">
    <animate attributeName="cy" values="118;102;118" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="36" r="2" fill="#818CF8" fill-opacity="0.5">
    <animate attributeName="cy" values="36;20;36" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="890" cy="130" r="1.5" fill="#C084FC" fill-opacity="0.5">
    <animate attributeName="cy" values="130;114;130" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="72" r="1" fill="#E879F9" fill-opacity="0.4">
    <animate attributeName="cy" values="72;56;72" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="106" r="2" fill="#7C3AED" fill-opacity="0.5">
    <animate attributeName="cy" values="106;90;106" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="530" cy="52" r="1.5" fill="#C084FC" fill-opacity="0.4">
    <animate attributeName="cy" values="52;36;52" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="138" r="1" fill="#B44FE8" fill-opacity="0.5">
    <animate attributeName="cy" values="138;122;138" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
