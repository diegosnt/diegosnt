<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#130c22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="name-grad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#B44FE8"/>
      <stop offset="70%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="orb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg-grad)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Ambient orbs -->
  <circle cx="150" cy="80" r="90" fill="#7C3AED" fill-opacity="0.12" filter="url(#orb-glow)">
    <animate attributeName="cx" values="150;185;150" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;105;80" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="190" r="110" fill="#B44FE8" fill-opacity="0.10" filter="url(#orb-glow)">
    <animate attributeName="cx" values="1060;1025;1060" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;165;190" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="300" r="130" fill="#4C1D95" fill-opacity="0.08" filter="url(#orb-glow)"/>

  <!-- Border lines -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#border-grad)"/>
  <rect x="0" y="278" width="1200" height="2" fill="url(#border-grad)"/>

  <!-- Decorative brackets -->
  <text x="52" y="168" font-family="monospace" font-size="88" fill="#B44FE8" fill-opacity="0.18">{</text>
  <text x="1118" y="168" font-family="monospace" font-size="88" fill="#B44FE8" fill-opacity="0.18">}</text>

  <!-- Name -->
  <text x="600" y="148"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="92"
    font-weight="800"
    text-anchor="middle"
    fill="url(#name-grad)"
    filter="url(#glow)"
    letter-spacing="-2">
    Diego
    <animate attributeName="opacity" values="0.88;1;0.88" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="600" y="184"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="17"
    font-weight="400"
    text-anchor="middle"
    fill="#94A3B8"
    letter-spacing="4">
    FULL STACK DEVELOPER  ·  DEVOPS ENTHUSIAST
  </text>

  <!-- Divider -->
  <line x1="440" y1="200" x2="760" y2="200" stroke="#B44FE8" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Tech tags -->
  <rect x="438" y="213" width="52" height="22" rx="5" fill="#B44FE8" fill-opacity="0.12" stroke="#B44FE8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="464" y="228" font-family="monospace" font-size="11" text-anchor="middle" fill="#C084FC">.NET</text>

  <rect x="498" y="213" width="65" height="22" rx="5" fill="#B44FE8" fill-opacity="0.12" stroke="#B44FE8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="530" y="228" font-family="monospace" font-size="11" text-anchor="middle" fill="#C084FC">Angular</text>

  <rect x="571" y="213" width="58" height="22" rx="5" fill="#B44FE8" fill-opacity="0.12" stroke="#B44FE8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="600" y="228" font-family="monospace" font-size="11" text-anchor="middle" fill="#C084FC">Docker</text>

  <rect x="637" y="213" width="42" height="22" rx="5" fill="#B44FE8" fill-opacity="0.12" stroke="#B44FE8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="658" y="228" font-family="monospace" font-size="11" text-anchor="middle" fill="#C084FC">K8s</text>

  <rect x="687" y="213" width="52" height="22" rx="5" fill="#B44FE8" fill-opacity="0.12" stroke="#B44FE8" stroke-opacity="0.35" stroke-width="1"/>
  <text x="713" y="228" font-family="monospace" font-size="11" text-anchor="middle" fill="#C084FC">CI/CD</text>

  <!-- Floating particles -->
  <circle cx="200" cy="220" r="2" fill="#B44FE8" fill-opacity="0.5">
    <animate attributeName="cy" values="220;198;220" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="355" cy="58" r="1.5" fill="#E879F9" fill-opacity="0.6">
    <animate attributeName="cy" values="58;38;58" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="48" r="2" fill="#818CF8" fill-opacity="0.5">
    <animate attributeName="cy" values="48;28;48" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="232" r="1.5" fill="#C084FC" fill-opacity="0.6">
    <animate attributeName="cy" values="232;210;232" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="278" cy="138" r="1" fill="#E879F9" fill-opacity="0.4">
    <animate attributeName="cy" values="138;118;138" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="955" cy="118" r="1.5" fill="#B44FE8" fill-opacity="0.5">
    <animate attributeName="cy" values="118;98;118" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="42" r="1" fill="#C084FC" fill-opacity="0.4">
    <animate attributeName="cy" values="42;22;42" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="248" r="2" fill="#7C3AED" fill-opacity="0.5">
    <animate attributeName="cy" values="248;228;248" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
