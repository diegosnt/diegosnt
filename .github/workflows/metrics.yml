name: GitHub Metrics — Languages

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pineado por commit SHA en vez de @latest: lowlighter/metrics no
      # publica tags semver desde 2023 y mantiene `latest` como rama móvil,
      # así que fijamos un commit concreto para evitar roturas silenciosas.
      # SHA de la rama `latest` al 2026-10-13.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          config_display: large
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_threshold: 0%
          filename: metrics-languages.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update language metrics"
